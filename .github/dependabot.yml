version: 2
updates:
  # JavaScript/TypeScript dependencies (pnpm workspace)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node must track the runtime (Node 22, see .nvmrc), not latest
      - dependency-name: '@types/node'
        versions: ['>=23']
    groups:
      # atproto packages are all 0.x, where a "minor" bump may be breaking by semver.
      # Keep them in their own PR so the changelog gets read, and the routine group
      # below stays safe to merge on green. Listed first: a dependency joins the
      # first group it matches.
      atproto:
        patterns:
          - '@atproto/*'
          - '@atproto-labs/*'
          - '@bsky/*'
        update-types:
          - minor
          - patch
      # Batch routine non-major bumps into a single PR to cut noise
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@atproto/*'
          - '@atproto-labs/*'
          - '@bsky/*'
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
