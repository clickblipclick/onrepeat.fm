name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @onrepeat/web build
        env:
          # Every route is dynamic, so the build never opens a database connection.
          # DATABASE_URL only has to be present: apps/web/lib/db.ts and jobs.ts throw
          # at import time when it is unset, which fails page-data collection.
          DATABASE_URL: postgres://build:build@127.0.0.1:5999/build
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onrepeat
          POSTGRES_PASSWORD: onrepeat
          POSTGRES_DB: onrepeat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onrepeat"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:int
        env:
          DATABASE_URL_INTTEST: postgres://onrepeat:onrepeat@localhost:5432/onrepeat_inttest
