services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onrepeat
      POSTGRES_PASSWORD: onrepeat
      POSTGRES_DB: onrepeat_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onrepeat']
      interval: 2s
      timeout: 5s
      retries: 15
